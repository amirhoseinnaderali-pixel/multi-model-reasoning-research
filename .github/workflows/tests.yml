name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"

      - name: Materialize and validate frozen benchmark
        run: |
          python scripts/materialize_exp001_benchmark.py --manifest benchmarks/manifests/exp001_v1.json --output benchmarks/programming/exp001_v1/tasks.jsonl
          python scripts/validate_benchmark.py

      - name: Commit benchmark artifact when needed
        run: |
          if git diff --quiet -- benchmarks/programming/exp001_v1/tasks.jsonl; then
            echo "Benchmark artifact already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add benchmarks/programming/exp001_v1/tasks.jsonl
            git commit -m "chore: materialize frozen EXP-001 benchmark"
            git push origin HEAD:main
          fi

      - run: python -m pytest
      - run: python scripts/run_experiment.py --config configs/experiments/exp001_fixed_budget.json --mode validation_only
