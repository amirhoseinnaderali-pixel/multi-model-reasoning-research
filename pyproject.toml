[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-model-reasoning-research"
version = "0.1.0"
description = "Controlled research infrastructure for fixed-budget multi-model reasoning experiments."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
real = ["openai>=1.0"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
